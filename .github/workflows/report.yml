name: Laporan progres monetisasi

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yt-upload
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ambil statistik dan hitung progres
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m src.analytics

      - name: Simpan hasil
        run: |
          git config user.name "yt-autopilot"
          git config user.email "yt-autopilot@users.noreply.github.com"
          git add STATUS.md data/status.json data/performance.json
          git diff --cached --quiet || (git commit -m "Update progres monetisasi" && git push)
